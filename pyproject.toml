[tool.poetry]
name = "vernum"
version = "7.4.0"
description = "Generate and process semantic version numbers"
authors = ["Francis Potter <vernum@fpotter.com>"]
license = "MIT"
readme = "README.md"
repository = 'https://github.com/SteamWiz/VerNum'

[tool.poetry.dependencies]
python = "^3.11"
wizlib = "^4.0.8"

[tool.poetry.group.dev.dependencies]
coverage = "^7.3.1"
autopep8 = "^2.0.4"
pycodestyle = "^2.11.0"
pytest = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
vernum = "vernum:VerNumApp.main"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
tag_format = "v{version}"
build_command = ""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
upload_to_vcs_release = false
